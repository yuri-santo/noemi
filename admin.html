<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Arca da Noemí</title>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="tailwind-admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #fffbeb 50%, #fefce8 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }

        .text-gradient {
            background: linear-gradient(to right, #B8860B, #FFD700, #B8860B);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Custom scrollbar para tabela */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        .avatar-initials {
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            color: #0284c7;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }
    </style>
</head>
<body class="text-gray-800 antialiased p-4 sm:p-8" style="overflow: hidden;">

    <!-- TELA DE LOGIN -->
    <div id="auth-overlay" class="fixed inset-0 bg-white/90 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="glass p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl border border-blue-100">
            <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-ark-darkblue text-3xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-cute mb-6 text-ark-darkblue">Acesso Restrito</h2>
            <input type="password" id="auth-pwd" autocomplete="current-password" placeholder="Digite a senha" class="w-full mb-4 px-4 py-3 border border-gray-200 rounded-xl text-center focus:outline-none focus:ring-2 focus:ring-ark-darkblue transition-shadow" onkeypress="if(event.key === 'Enter') checkAuth()">
            <button id="auth-btn" onclick="checkAuth()" class="w-full bg-ark-darkblue text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-md">Acessar Painel</button>
            <p id="auth-error" class="text-red-500 text-sm mt-3 hidden font-semibold">Senha incorreta.</p>
        </div>
    </div>

    <!-- TROCAR SENHA -->
    <div id="pwd-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 items-center justify-center p-4" style="display:none;">
        <div class="glass p-7 rounded-3xl max-w-sm w-full shadow-2xl border border-blue-100">
            <div class="text-center mb-5">
                <div class="w-14 h-14 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-3 text-amber-500 text-2xl">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 class="text-xl font-cute text-ark-darkblue">Trocar senha do painel</h2>
            </div>
            <input type="password" id="pwd-new" autocomplete="new-password" placeholder="Nova senha (mín. 8 caracteres)" class="w-full mb-3 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ark-darkblue">
            <input type="password" id="pwd-confirm" autocomplete="new-password" placeholder="Repita a nova senha" class="w-full mb-3 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ark-darkblue" onkeypress="if(event.key === 'Enter') savePassword()">
            <p id="pwd-msg" class="text-sm mb-3 hidden font-semibold"></p>
            <div class="flex gap-3">
                <button onclick="closePasswordModal()" class="flex-1 bg-white hover:bg-gray-50 text-gray-600 py-3 rounded-xl font-bold border border-gray-200 transition">Cancelar</button>
                <button id="pwd-save-btn" onclick="savePassword()" class="flex-1 bg-ark-darkblue text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-md">Salvar</button>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto space-y-6" id="main-content" style="opacity: 0; pointer-events: none; transition: opacity 0.5s;">

        <!-- HEADER -->
        <header class="glass rounded-3xl p-6 sm:p-10 relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-ark-blue via-ark-gold to-ark-blue"></div>
            
            <div class="flex items-center gap-6 text-center md:text-left">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg border-4 border-yellow-100 flex-shrink-0">
                    <i class="fa-solid fa-sailboat text-4xl text-ark-darkblue"></i>
                </div>
                <div>
                    <h1 class="font-cursive text-5xl sm:text-6xl text-gradient leading-none mb-1">Noemí</h1>
                    <p class="font-sans text-xs tracking-[0.25em] uppercase text-ark-brown/70 font-bold">Painel Administrativo — 1 Aninho</p>
                </div>
            </div>

            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="exportToCSV()" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-white hover:bg-gray-50 text-ark-darkblue font-semibold text-sm py-2.5 px-5 rounded-xl border border-gray-200 shadow-sm transition-all hover:shadow-md">
                    <i class="fa-solid fa-file-csv"></i> Exportar CSV
                </button>
                <button onclick="refreshData()" class="flex items-center justify-center bg-ark-darkblue hover:bg-blue-700 text-white w-11 h-11 rounded-xl shadow-md transition-transform hover:scale-105" title="Atualizar">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button onclick="openPasswordModal()" class="flex items-center justify-center bg-white hover:bg-amber-50 text-amber-600 w-11 h-11 rounded-xl border border-gray-200 shadow-sm transition-transform hover:scale-105" title="Trocar senha do painel">
                    <i class="fa-solid fa-key"></i>
                </button>
                <button onclick="logout()" class="flex items-center justify-center bg-white hover:bg-red-50 text-red-500 w-11 h-11 rounded-xl border border-gray-200 shadow-sm transition-transform hover:scale-105" title="Sair do painel">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>



        <!-- ABA 1: RSVP (CONFIRMAÇÕES) -->
        <div id="view-rsvp" class="space-y-6">

        <!-- ESTATÍSTICAS -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="glass rounded-2xl p-5 flex items-center gap-4 hover:-translate-y-1 transition-transform">
                <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 text-xl">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Total Registros</p>
                    <p id="stat-total" class="font-cute text-3xl text-gray-800 leading-none">0</p>
                </div>
            </div>
            
            <div class="glass rounded-2xl p-5 flex items-center gap-4 hover:-translate-y-1 transition-transform">
                <div class="w-12 h-12 rounded-full bg-green-50 flex items-center justify-center text-green-500 text-xl">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Confirmados (Pessoas)</p>
                    <p id="stat-people" class="font-cute text-3xl text-green-600 leading-none">0</p>
                </div>
            </div>

            <div class="glass rounded-2xl p-5 flex items-center gap-4 hover:-translate-y-1 transition-transform">
                <div class="w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-500 text-xl">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Respostas "Vou"</p>
                    <p id="stat-going" class="font-cute text-3xl text-emerald-600 leading-none">0</p>
                </div>
            </div>

            <div class="glass rounded-2xl p-5 flex items-center gap-4 hover:-translate-y-1 transition-transform">
                <div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center text-red-400 text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Não Vão</p>
                    <p id="stat-notgoing" class="font-cute text-3xl text-red-500 leading-none">0</p>
                </div>
            </div>
        </div>

        <!-- TABELA -->
        <div class="glass rounded-3xl p-5 sm:p-8 flex flex-col h-[600px]">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <div class="relative w-full md:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="Buscar convidado..." class="w-full bg-white border border-gray-200 rounded-xl py-2 pl-9 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-ark-gold/50 transition-all">
                </div>

                <div class="flex bg-gray-100 p-1 rounded-xl w-full md:w-auto">
                    <button onclick="filterTable('all')" id="btn-all" class="flex-1 md:flex-none px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-gray-800">Todos</button>
                    <button onclick="filterTable('going')" id="btn-going" class="flex-1 md:flex-none px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-500 hover:text-green-600">Vão</button>
                    <button onclick="filterTable('notgoing')" id="btn-notgoing" class="flex-1 md:flex-none px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-500 hover:text-red-500">Não Vão</button>
                </div>
            </div>

            <div class="overflow-y-auto overflow-x-auto custom-scrollbar flex-1 border border-gray-100 rounded-2xl bg-white/50">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-gray-50/80 sticky top-0 z-10 backdrop-blur-md">
                        <tr class="text-xs uppercase tracking-wider text-gray-500 font-bold border-b border-gray-200">
                            <th class="py-4 pl-6 pr-4">Família e acompanhantes</th>
                            <th class="py-4 px-4 text-center">Qtd. Pessoas</th>
                            <th class="py-4 px-4 text-center">Status</th>
                            <th class="py-4 pr-6 pl-4 text-right">Data do Registro</th>
                            <th class="py-4 px-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-100">
                        <!-- Conteúdo injetado via JS -->
                    </tbody>
                </table>
            </div>
            
            <div class="mt-4 flex justify-between items-center text-xs text-gray-400">
                <span><i class="fa-solid fa-database text-ark-gold"></i> Dados armazenados de forma segura na nuvem (Supabase).</span>
            </div>
        </div>
        </div> <!-- FIM ABA 1 -->



    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        /* =================================================================
           ⚠️ ATENÇÃO: COLOQUE SUAS CHAVES DO SUPABASE AQUI ⚠️
           ================================================================= */
        const SUPABASE_URL = "https://izphobguvtfjqzrsbkva.supabase.co";
        // Chave anon: é pública por natureza num site estático — o navegador precisa
        // dela para falar com a API. A proteção real está no RLS: sozinha, esta chave
        // só consegue INSERIR uma confirmação. Ler a lista e excluir exigem o login
        // abaixo, que gera um JWT de usuário autenticado.
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6cGhvYmd1dnRmanF6cnNia3ZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTYzMjEsImV4cCI6MjEwMTI3MjMyMX0.EyLTpW7y1-UV4qllmw6Nh0mjN0r2wLQzxbmp99iHGOg";

        // Identificador interno da conta do painel. Nunca aparece na tela: o Supabase
        // Auth exige um login, mas quem usa o painel só digita a senha.
        const ADMIN_LOGIN = "painel@convite-noemi.local";

        // window.supabase pode não existir se o CDN cair / for bloqueado.
        // Sem o `?.` um TypeError aqui derrubava TODO o script.
        const supabaseClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) ?? null;

        function authMsg(texto) {
            const err = document.getElementById('auth-error');
            err.textContent = texto;
            err.classList.remove('hidden');
            err.style.display = 'block';
            err.classList.add('animate-bounce');
            setTimeout(() => err.classList.remove('animate-bounce'), 1000);
        }

        function abrirPainel() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            const main = document.getElementById('main-content');
            main.style.opacity = '1';
            main.style.pointerEvents = 'auto';
            window.iniciarPainel?.();
        }

        // LOGIN — a senha vai para o Supabase Auth, que devolve um JWT.
        // Ela não fica mais escrita no código-fonte da página.
        window.checkAuth = async function() {
            const pwd = document.getElementById('auth-pwd').value;
            const btn = document.getElementById('auth-btn');

            if (!supabaseClient) { authMsg('Sem conexão com o servidor. Verifique sua internet.'); return; }
            if (!pwd) { authMsg('Digite a senha.'); return; }

            const textoOriginal = btn.textContent;
            btn.textContent = 'Entrando...';
            btn.disabled = true;

            const { error } = await supabaseClient.auth.signInWithPassword({
                email: ADMIN_LOGIN, password: pwd
            });

            btn.textContent = textoOriginal;
            btn.disabled = false;

            if (error) {
                authMsg(error.message.includes('Invalid login') ? 'Senha incorreta.' : error.message);
                return;
            }
            document.getElementById('auth-pwd').value = '';
            abrirPainel();
        };

        window.logout = async function() {
            await supabaseClient?.auth.signOut();
            location.reload();
        };

        // TROCAR SENHA — grava direto no Supabase Auth, sem editar arquivo nenhum.
        window.openPasswordModal = function() {
            document.getElementById('pwd-new').value = '';
            document.getElementById('pwd-confirm').value = '';
            document.getElementById('pwd-msg').classList.add('hidden');
            document.getElementById('pwd-modal').style.display = 'flex';
        };
        window.closePasswordModal = function() {
            document.getElementById('pwd-modal').style.display = 'none';
        };

        window.savePassword = async function() {
            const nova = document.getElementById('pwd-new').value;
            const conf = document.getElementById('pwd-confirm').value;
            const msg  = document.getElementById('pwd-msg');
            const btn  = document.getElementById('pwd-save-btn');

            const erro = (t) => {
                msg.textContent = t;
                msg.className = 'text-sm mb-3 font-semibold text-red-500';
            };

            if (nova.length < 8)  { erro('A nova senha precisa ter pelo menos 8 caracteres.'); return; }
            if (nova !== conf)    { erro('As duas senhas não são iguais.'); return; }

            btn.disabled = true;
            btn.textContent = 'Salvando...';
            const { error } = await supabaseClient.auth.updateUser({ password: nova });
            btn.disabled = false;
            btn.textContent = 'Salvar';

            if (error) { erro(error.message); return; }

            msg.textContent = 'Senha alterada! Use a nova senha no próximo acesso.';
            msg.className = 'text-sm mb-3 font-semibold text-green-600';
            setTimeout(closePasswordModal, 2200);
        };

        // Sessão já aberta neste aparelho? Entra direto, sem pedir senha de novo.
        supabaseClient?.auth.getSession().then(({ data }) => {
            if (data.session) abrirPainel();
        });



        // LÓGICA DE DADOS - RSVP
        (function() {
            const tableBody   = document.getElementById('table-body');
            const searchInput = document.getElementById('search-input');
            const statTotal   = document.getElementById('stat-total');
            const statGoing   = document.getElementById('stat-going');
            const statNotGoing = document.getElementById('stat-notgoing');
            const statPeople  = document.getElementById('stat-people');
            
            let currentFilter = 'all';
            let searchQuery = '';

            let loadedRecords = [];

            async function loadData() {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient.from('guests').select('*').order('created_at', { ascending: false });
                    if (!error && data) {
                        loadedRecords = data.map(row => ({
                            names: row.guest_names.split(',').map(n => n.trim()),
                            isGoing: row.is_going,
                            timestamp: row.created_at,
                            headcount: row.headcount,
                            companions: row.companions || []
                        }));
                        return loadedRecords;
                    }
                }
                
                // Fallback para LocalStorage se Supabase falhar
                try { 
                    const stored = JSON.parse(localStorage.getItem('arca_noemi_rsvps') || '[]');
                    loadedRecords = stored.map(row => ({
                        names: row.guest_names ? row.guest_names.split(',').map(n => n.trim()) : (row.names || []),
                        isGoing: row.is_going !== undefined ? row.is_going : row.isGoing,
                        timestamp: row.created_at || row.date || new Date().toISOString(),
                        headcount: row.headcount || (row.names ? row.names.length : 1),
                        companions: row.companions || []
                    }));
                } catch (e) {
                    loadedRecords = [];
                }
                return loadedRecords;
            }

            function formatDate(iso) {
                const d = new Date(iso);
                const today = new Date();
                const isToday = d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
                
                const time = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                if (isToday) return `Hoje às ${time}`;
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + ' às ' + time;
            }

            // Nomes vêm de um formulário público e caem em innerHTML.
            // Sem escapar, um convidado podia injetar script no painel.
            function esc(s) {
                return String(s ?? '').replace(/[&<>"']/g, ch => (
                    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]
                ));
            }

            function getInitials(name) {
                const parts = name.trim().split(' ');
                if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
                return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            }

            // Busca no banco e redesenha. Use só quando os dados podem ter mudado.
            async function refresh() {
                await loadData();
                draw();
            }

            // Redesenha a partir do cache local — filtro e busca não precisam ir ao banco.
            function draw() {
                const records = loadedRecords;

                if (records.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-16 text-center">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-300 text-2xl"><i class="fa-solid fa-ghost"></i></div>
                        <p class="text-gray-500 font-semibold">Nenhuma confirmação registrada ainda.</p>
                        <p class="text-xs text-gray-400 mt-1">Os registros aparecerão aqui quando os convidados responderem.</p>
                    </td></tr>`;
                    updateStats(0,0,0,0);
                    return;
                }

                // Stats
                const totalRecords = records.length;
                const goingRecords = records.filter(r => r.isGoing).length;
                const notGoingRecords = records.filter(r => !r.isGoing).length;
                let totalPeople = 0;
                records.forEach(r => { if (r.isGoing) totalPeople += r.headcount; });
                updateStats(totalRecords, goingRecords, notGoingRecords, totalPeople);

                // Filtrar e Buscar (Supabase já vem com o mais novo primeiro, mas o fallback pode precisar)
                let filtered = [...records];
                
                if (currentFilter === 'going') filtered = filtered.filter(r => r.isGoing);
                if (currentFilter === 'notgoing') filtered = filtered.filter(r => !r.isGoing);
                
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    filtered = filtered.filter(r => r.names.some(n => n.toLowerCase().includes(q)));
                }

                if (filtered.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-gray-400 font-semibold">Nenhum resultado encontrado para a busca.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = filtered.map(r => {
                    const namesList = r.names || ['Desconhecido'];
                    const mainName = namesList[0];
                    const initials = getInitials(mainName);
                    
                    // ── NÓ PAI: o titular da família ──
                    const comps = r.companions || [];
                    const namesHtml = namesList.map((n, i) => {
                        if (i === 0) return `<span class="font-bold text-gray-800">${esc(n)}</span>`;
                        return `<span class="text-gray-500">${esc(n)}</span>`;
                    }).join('<span class="mx-1 text-gray-300">•</span>');

                    const paiHtml = `
                        <div class="flex items-center gap-2 flex-wrap">
                            <i class="fa-solid fa-house-user text-ark-darkblue text-xs"></i>
                            <span class="max-w-[170px] sm:max-w-xs whitespace-normal break-words">${namesHtml}</span>
                            ${comps.length ? `<span class="px-1.5 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wide bg-amber-50 text-amber-700 border border-amber-100">${comps.length + 1} pessoas</span>` : ''}
                        </div>`;

                    // ── NÓS FILHOS: acompanhantes pendurados no titular ──
                    // O nome é opcional no formulário, então cai para "Acompanhante".
                    let companionsHtml = '';
                    if (comps.length > 0) {
                        companionsHtml = `<div class="mt-1 flex flex-col">` + comps.map((c, i) => {
                            const last = i === comps.length - 1;
                            const crianca = c.type === 'Criança';
                            const nome = (c.name || '').trim();
                            return `
                            <div class="flex items-center gap-1.5 text-xs leading-relaxed">
                                <span class="text-gray-300 font-mono select-none">${last ? '└─' : '├─'}</span>
                                <i class="fa-solid ${crianca ? 'fa-child-reaching text-green-500' : 'fa-user text-blue-500'} text-[10px] w-3"></i>
                                <span class="${nome ? 'text-gray-700 font-medium' : 'text-gray-400 italic'}">${nome ? esc(nome) : 'Acompanhante'}</span>
                                <span class="px-1.5 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wide ${crianca ? 'bg-green-50 text-green-600' : 'bg-blue-50 text-blue-600'}">${esc(c.type)}</span>
                            </div>`;
                        }).join('') + `</div>`;
                    }

                    const statusHtml = r.isGoing
                        ? '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-50 text-green-600 font-bold text-[11px] uppercase tracking-wide border border-green-100"><i class="fa-solid fa-check"></i> Vai</span>'
                        : '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-50 text-red-500 font-bold text-[11px] uppercase tracking-wide border border-red-100"><i class="fa-solid fa-xmark"></i> Não vai</span>';

                    return `
                        <tr class="hover:bg-blue-50/30 transition-colors group">
                            <td class="py-4 pl-6 pr-4 align-top">
                                <div class="flex items-start gap-3">
                                    <div class="w-8 h-8 rounded-full avatar-initials flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">
                                        ${esc(initials)}
                                    </div>
                                    <div class="flex-1">
                                        ${paiHtml}
                                        ${companionsHtml}
                                    </div>
                                </div>
                            </td>
                            <td class="py-4 px-4 text-center align-top">
                                <span class="font-cute text-lg ${r.isGoing ? 'text-gray-700' : 'text-gray-300'}">${r.isGoing ? r.headcount : '-'}</span>
                            </td>
                            <td class="py-4 px-4 text-center align-top">${statusHtml}</td>
                            <td class="py-4 pr-6 pl-4 text-right text-xs text-gray-400 font-medium group-hover:text-gray-600 align-top">${formatDate(r.timestamp)}</td>
                            <td class="py-4 px-4 text-center align-top">
                                <button onclick="deleteRSVP(this.dataset.names)" data-names="${esc(r.names.join(', '))}" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition-colors" title="Excluir Registro">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            function updateStats(total, going, notGoing, people) {
                statTotal.textContent = total;
                statGoing.textContent = going;
                statNotGoing.textContent = notGoing;
                statPeople.textContent = people;
            }

            window.filterTable = function(filter) {
                currentFilter = filter;
                const activeCls = "flex-1 md:flex-none px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-gray-800";
                const inactiveCls = "flex-1 md:flex-none px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-500 hover:text-gray-700";
                
                document.getElementById('btn-all').className = filter === 'all' ? activeCls : inactiveCls;
                document.getElementById('btn-going').className = filter === 'going' ? activeCls : inactiveCls;
                document.getElementById('btn-notgoing').className = filter === 'notgoing' ? activeCls : inactiveCls;

                draw();
            };

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                draw();
            });

            window.deleteRSVP = async function(namesStr) {
                if (!confirm(`Deseja realmente excluir o registro de ${namesStr}?`)) return;

                if (!supabaseClient) {
                    alert('Sem conexão com o banco. Não foi possível excluir.');
                    return;
                }

                // O supabase-js v2 NÃO rejeita a promise em erro: devolve { error }.
                // Sem checar isso o painel dizia "excluído" mesmo quando nada saía do banco.
                const { error, count } = await supabaseClient
                    .from('guests').delete({ count: 'exact' }).eq('guest_names', namesStr);

                if (error) {
                    console.error('Erro ao excluir', error);
                    alert('Erro ao excluir registro: ' + error.message);
                    return;
                }
                if (!count) {
                    alert('Nenhum registro foi excluído. Atualize a página e tente de novo.');
                    return;
                }
                refresh();
            };

            window.refreshData = function() {
                const btn = document.querySelector('.fa-rotate').parentElement;
                btn.classList.add('rotate-180');
                refresh();
                setTimeout(() => btn.classList.remove('rotate-180'), 300);
            };

            window.exportToCSV = function() {
                const records = loadedRecords;
                if (records.length === 0) {
                    alert('Não há dados para exportar.');
                    return;
                }
                
                // Uma linha por pessoa, mantendo a hierarquia família → acompanhantes.
                // A coluna "Família" repete em todas as linhas do grupo para permitir
                // agrupar/filtrar direto no Excel.
                const csvData = [];
                records.forEach(r => {
                    const familia = (r.names && r.names[0]) || 'Desconhecido';
                    const status = r.isGoing ? 'Confirmado' : 'Não vai';
                    const comps = r.isGoing ? (r.companions || []) : [];

                    csvData.push({
                        'Família': familia,
                        'Nível': 1,
                        'Nome': r.names.join(', '),
                        'Tipo': 'Titular',
                        'Status': status,
                        'Total da Família': r.isGoing ? r.headcount : 0,
                        'Data do Registro': new Date(r.timestamp).toLocaleString('pt-BR')
                    });

                    comps.forEach((c, i) => {
                        const nome = (c.name || '').trim() || 'Acompanhante (sem nome)';
                        csvData.push({
                            'Família': familia,
                            'Nível': 2,
                            'Nome': (i === comps.length - 1 ? '└─ ' : '├─ ') + nome,
                            'Tipo': c.type,
                            'Status': status,
                            'Total da Família': '',
                            'Data do Registro': ''
                        });
                    });
                });

                // Resumo do evento, para o cabe\u00e7alho da planilha.
                let familias = 0, pessoas = 0, adultos = 0, criancas = 0, naoVao = 0;
                records.forEach(r => {
                    if (!r.isGoing) { naoVao++; return; }
                    familias++;
                    pessoas += r.headcount;
                    adultos += r.names.length; // titular(es) contam como adultos
                    (r.companions || []).forEach(c => c.type === 'Crian\u00e7a' ? criancas++ : adultos++);
                });

                const cabecalho = Papa.unparse([
                    ['LISTA DE CONVIDADOS \u2014 1 ANINHO DA NOEMI'],
                    ['Gerado em', new Date().toLocaleString('pt-BR')],
                    [],
                    ['RESUMO'],
                    ['Fam\u00edlias confirmadas', familias],
                    ['Total de pessoas confirmadas', pessoas],
                    ['Adultos', adultos],
                    ['Crian\u00e7as', criancas],
                    ['Responderam que n\u00e3o v\u00e3o', naoVao],
                    [],
                    ['DETALHAMENTO POR FAM\u00cdLIA (N\u00edvel 1 = titular \u00b7 N\u00edvel 2 = acompanhante)'],
                    []
                ]);

                const csv = cabecalho + '\r\n' + Papa.unparse(csvData);
                const blob = new Blob(["\ufeff"+csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                const hoje = new Date().toISOString().slice(0, 10);
                link.setAttribute("href", url);
                link.setAttribute("download", `convidados_noemi_${hoje}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };



            // Só busca dados depois do login: com o RLS ativo, uma consulta sem
            // sessão volta vazia e o painel mostraria "nenhuma confirmação".
            let jaIniciado = false;
            window.iniciarPainel = function() {
                if (jaIniciado) return;
                jaIniciado = true;
                refresh();
                // Auto-refresh sutil (30s: no plano free, 10s dava 8.640 queries/dia)
                setInterval(() => {
                    if (!searchQuery) refresh(); // não atualiza no meio de uma busca
                }, 30000);
            };
        })();
    </script>
</body>
</html>
